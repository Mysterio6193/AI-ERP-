name: Desktop build

# Installers are produced on the platform they target: a signed .dmg needs
# macOS and an Apple certificate, a signed installer needs Windows and a
# code-signing certificate. Neither can be produced on Linux, which is why this
# fans out rather than building everything in one job.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  # The boot sequence is the part that actually breaks, and it has no GUI
  # dependency, so it runs first on every platform. A failure here is far
  # cheaper to read than the same failure inside a signing job.
  supervisor:
    name: Supervisor tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/desktop/supervisor/Cargo.toml

  bundle:
    name: Installer (${{ matrix.os }})
    needs: supervisor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # The bundle carries this platform's Postgres, so the postinstall that
      # hydrates those binaries has to be allowed to run.
      - name: Fetch Postgres binaries
        run: npm rebuild @embedded-postgres/${{ runner.os == 'Windows' && 'windows-x64' || (matrix.target == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64') }} || true

      - name: Build the server
        run: npm run build
        env:
          # A build-time database is not needed — Prisma only generates the
          # client here; the real URL is chosen per-install at launch.
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Assemble the bundle
        run: node apps/desktop/scripts/bundle.mjs

      - name: Build and sign
        uses: tauri-apps/tauri-action@v0
        env:
          # Supply these as repository secrets. Without them the build still
          # produces an installer, but an unsigned one that macOS Gatekeeper
          # and Windows SmartScreen will both warn about.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: supplysure-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
