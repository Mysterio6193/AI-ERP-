name: CI and deploy to Cloud Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job exchanges GitHub's short-lived OIDC token for Google Cloud
# credentials. No service-account key or GCP secret is stored in GitHub.
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-eaa70f68-0787-4b5e-b79
  GCP_REGION: asia-south1
  ARTIFACT_REPOSITORY: supplysure-os
  CLOUD_RUN_SERVICE: supplysure-web

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Build and deploy
    needs: test
    # Pull requests are validated but can never deploy. The GCP provider
    # separately enforces this same branch restriction.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/794294147741/locations/global/workloadIdentityPools/github-actions/providers/github-actions-provider
          service_account: github-actions-deployer@project-eaa70f68-0787-4b5e-b79.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and publish image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/core:${{ github.sha }}
        run: |
          docker build --target core --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/core:${{ github.sha }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$IMAGE" \
            --quiet
